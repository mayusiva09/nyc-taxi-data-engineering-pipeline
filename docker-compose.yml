services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taxi_user
      POSTGRES_PASSWORD: *********
      POSTGRES_DB: taxi_data
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init-airflow-db.sh:/docker-entrypoint-initdb.d/01-airflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi_analytics"]
      interval: 5s
      retries: 20

  airflow-init:
    build: {context: ., dockerfile: Dockerfile.airflow}
    user: "50000:0"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://taxi_user:********@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      PYTHONPATH: /opt/project
      TAXI_DATABASE_URL: postgresql://taxi_user:*********@postgres:5432/taxi_data
      TAXI_DATA_DIR: /opt/project/data
      TAXI_SQL_FILE: /opt/project/sql/schema.sql
    volumes: &project_mounts
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres: {condition: service_healthy}
    command: bash -c 'airflow db migrate && (airflow users create --username admin --firstname mayu --lastname siva --role Admin --email mayusiva@example.com --password admin || true)'

  airflow-webserver:
    build: {context: ., dockerfile: Dockerfile.airflow}
    user: "50000:0"
    environment: *airflow_env
    volumes:
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: {context: ., dockerfile: Dockerfile.airflow}
    user: "50000:0"
    environment: *airflow_env
    volumes:
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    command: scheduler
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    environment:
      TAXI_DATABASE_URL: postgresql://taxi_user:***********@postgres:5432/taxi_data
    ports: ["8501:8501"]
    volumes:
      - ./dashboard:/app
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  airflow_logs:
